<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; }
        .card { background-color: #ffffff; border-radius: 8px; max-width: 600px; margin: 0 auto; padding: 24px; border: 1px solid #7c3aed; }
        .header { border-bottom: 2px solid #6d28d9; padding-bottom: 12px; margin-bottom: 20px; }
        .header h2 { color: #4c1d95; margin: 0; font-size: 20px; }
        .badge { background-color: #ede9fe; color: #5b21b6; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 6px; }
        .content { color: #334155; line-height: 1.6; margin-bottom: 20px; }
        .footer { font-size: 12px; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>{{ subject }}</h2>
            <span class="badge">TASK ESCALATION</span>
        </div>
        <div class="content">
            <p>{{ body }}</p>
            <ul>
                <li><strong>Process ID:</strong> {{ process_id }}</li>
                <li><strong>Task ID:</strong> {{ task_id }}</li>
                <li><strong>Escalated Role:</strong> {{ recipient_role }}</li>
            </ul>
        </div>
        <div class="footer">
            <p>Sent by BPMFlow AI — Intelligent Workflow Execution Agent (Agent 2).</p>
        </div>
    </div>
</body>
</html>
